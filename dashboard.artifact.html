up states its distance","src":["r_gca"]},{"v":"+6.7 pp bank-stated, 31 Mar 2026 (phased-in CET1 17.1%)","src":["r_gca"]},{"tone":"stronger","v":""}]],"note":"Basel Committee: 'banks' must report and disclose G-SIB indicators as year averages; every bank in the Basel assessment sample reports, but the capital effect (G-SIB buffer) falls only on banks on the FSB G-SIB list, so these 8 are covered. Out of scope: Lloyds, UniCredit, Intesa Sanpaolo, BBVA, CaixaBank, Commerzbank, Nordea (not on the FSB G-SIB list of 27 Nov 2025; 2026 list not yet found on fsb.org). Ranked by CET1 level, not headroom: only 3 of the 8 have a current stated requirement (UBS, Societe Generale, Groupe Credit Agricole). Groupe Credit Agricole is measured on the group record; Credit Agricole S.A. itself: CET1 11.3% at Q2 2026, and 2.6 pp above its SREP requirement at 31 Mar 2026 (bank-stated).","note_src":["w_wd","w_fsb","f_casa","r_gca"]},{"title":"Who it hits: G-SIB methodology review, Banking Union cross-border exposures (Basel Committee, 16 Oct 2026, consultation) · CET1 ratio","type":"table","columns":["Name","CET1 ratio (as reported), Q2 2026","vs median","Stated requirement (date)","Distance to requirement","Position"],"rows":[["BNP Paribas",{"v":"12.97%","src":["f_bnp"]},"not ranked",{"v":"10.51% (CET1 capital requirement, 30 Sep 2025, older)","src":["r_bnp"]},{"v":"+2.46 pp (vs older requirement)","src":["f_bnp","r_bnp"]},"list too short to rank"],["ING Groep N.V.",{"v":"13.07%","src":["f_ing"]},"not ranked",{"v":"11.03% (MDA trigger level for CET1, 31 Dec 2025, older)","src":["r_ing"]},{"v":"+2.04 pp (vs older requirement)","src":["f_ing","r_ing"]},"list too short to rank"],["Societe Generale",{"v":"13.20%","src":["f_sg"]},"not ranked",{"v":"10.26% (CET1 requirement, shown against 31 Mar 2026)","src":["r_sg"]},{"v":"+2.94 pp","src":["f_sg","r_sg"]},"list too short to rank"],["Deutsche Bank AG",{"v":"13.92%","src":["f_db"]},"not ranked","not stated","not stated","list too short to rank"],["Groupe Credit Agricole",{"v":"17.23%","src":["f_gca"]},"not ranked",{"v":"total not stated; group states its distance","src":["r_gca"]},{"v":"+6.7 pp bank-stated, 31 Mar 2026 (phased-in CET1 17.1%)","src":["r_gca"]},"list too short to rank"]],"note":"Basel Committee consults on adding its agreed treatment of cross-border exposures within the European Banking Union to the G-SIB assessment methodology. The page names only 'G-SIBs'; the treatment bears on banking-union G-SIBs, so the names covered are the five headquartered there (scope judged by this run, not stated by the Committee). Out of scope: HSBC, Barclays, UBS (G-SIBs outside the banking union); the other seven are not on the FSB G-SIB list of 27 Nov 2025. Five names: list too short to rank. Credit Agricole S.A. itself: CET1 11.3% at Q2 2026.","note_src":["w_meth","w_fsb","f_casa"]},{"title":"What changed","type":"items","items":[{"flag":"Asked","tag":"Asked","name":"Liquidity channel (LCR)","text":"No regulatory change to the LCR was found at the seven primary regulators between 16 Oct and 15 Nov 2026. Shown as asked: every name's distance to the 100% minimum, in the LCR table above. The only liquidity-related step was the EBA deferring new liquidity reporting requirements to December 2028 (a reporting item, see below).","why":"Liquidity headroom sets how much stress outflow a bank can absorb before breaching the minimum; all 15 names sit above it, the closest 34 pp above.","src":["w_basel","w_rep","f_hsbc"]},{"flag":"NEW","tag":"Final","name":"FINMA","text":"Partially revised FINMA Anti-Money Laundering Ordinance published; clarifies correspondent banking rules and recognises revised bank self-regulation. In force 1 January 2027. Channel: AML (watch).","why":"Compliance and conduct risk for UBS; no capital or liquidity metric attached.","src":["w_aml"]},{"flag":"NEW","tag":"Final","name":"PRA","text":"PS20/26 finalises Part 2 of large exposures changes: removes internal models for SFT exposure values, makes the substitution approach mandatory, and reduces the trading book excess allowance. Effective 1 January 2028. Channel: large exposures (watch).","why":"Concentration limits for HSBC, Barclays and Lloyds; Moody's data has no large exposures metric.","src":["w_le"]},{"flag":"NEW","tag":"Consultation","name":"Basel Committee","text":"Consults on additional Pillar 2 guidance for interest rate risk in the banking book (model risk, stress testing, embedded gains and losses in securities, earnings indicators) and supervisory reporting. Comments by 9 February 2027. Channel: IRRBB (watch).","why":"Could raise supervisory scrutiny of banks with large unrealised securities losses or earnings sensitivity; a consultation, not a final rule.","src":["w_irrbb"]},{"flag":"NEW","tag":"Final","name":"EBA","text":"Final methodology for the 2027 EU-wide stress test, with 55% fewer data points and a separate climate module that does not affect core results. Launch end-January 2027, results end-July 2027. Channel: stress testing (watch).","why":"Results feed supervisors' Pillar 2 guidance on capital; the sample is not listed on the page.","src":["w_st"]},{"flag":"NEW","tag":"Other","name":"EBA","text":"Next steps on supervisory reporting simplification: final ITS report due December 2026; first reference date postponed to December 2027; liquidity, asset encumbrance, benchmarking and ESG reporting deferred to December 2028. Channel: reporting (watch).","why":"Lower reporting burden; no change to any ratio's level or requirement.","src":["w_rep"]},{"flag":"NEW","tag":"Final","name":"EBA","text":"Revised Guidelines on internal governance aligned with CRD VI: stronger board and risk committee independence, more proportionality. Application date not stated on the page. Channel: governance (watch). Moody's view (11 Nov 2026): credit positive for EU banks, with a greater effect on smaller banks.","why":"Moody's sees the effect building gradually rather than changing large banks' credit profiles.","src":["w_gov","m_gov"]},{"flag":"NEW","tag":"Consultation","name":"Basel Committee","text":"Consults on consequential amendments to the Basel Framework so cross-references point to the new consolidated guidelines, moving application guidance chapters there. Comments by 21 December 2026. Mapped to watch by this run's judgment: the channel map has no row for technical cross-references.","why":"Technical; no change to any requirement is described on the page.","src":["w_cons"]},{"flag":"NEW","tag":"Consultation","name":"FINMA","text":"Consults on a partial revision of Circular 2019/2 updating the interest rate shocks used to measure IRRBB, following the Basel Committee's July 2024 recalibration. Comments by 15 January 2027. Channel: IRRBB (watch).","why":"Applies to UBS among Swiss banks; measurement of banking-book rate risk may change.","src":["w_irr_ch"]},{"flag":"NEW","tag":"Consultation","name":"PRA","text":"CP14/26 proposes removing pre-approval for about half of Senior Manager Functions and the Certification Regime requirements. Comments by 22 January 2027; implementation expected H2 2027, subject to legislation. Channel: governance, conduct (watch).","why":"Lower compliance burden for UK banks; no credit metric attached.","src":["w_smcr"]},{"flag":"NEW","tag":"Other","name":"European Commission","text":"Political agreement between Parliament and Council on the Securitisation Framework review, including a more risk-sensitive CRR treatment of securitisations. Formal approval pending; enters into force on publication. Channel: securitisation (watch).","why":"Could lower capital charges on securitisation positions for EU banks once adopted; not yet law.","src":["w_sec"]},{"flag":"NEW","tag":"Final","name":"Basel Committee","text":"Final amendments to the G-SIB framework against window dressing: indicators reported and disclosed as year averages (by 1 January 2030); reporting threshold raised to EUR 350bn leverage exposure (from 1 January 2027). Channel: capital, G-SIB buffer measurement (CET1).","why":"Averaging can raise scores for banks that shrink balance sheets at year-end, and with them the G-SIB buffer; see the CET1 table.","src":["w_wd"]},{"flag":"NEW","tag":"Consultation","name":"Basel Committee","text":"Consults on adding the agreed treatment of cross-border exposures within the European Banking Union to the G-SIB assessment methodology. Comments by 14 January 2027. Channel: capital, G-SIB buffer measurement (CET1).","why":"Could change G-SIB scores, and so buffers, for banking-union G-SIBs; a consultation, not a final rule.","src":["w_meth"]}]},{"title":"Who it hits: no Moody's metric","type":"table","columns":["Item","Covers on this list","Metric needed","Call"],"rows":[["IRRBB additional Pillar 2 guidance (BCBS, 9 Nov, consultation)","All 15 names, once their home authority applies the standard","IRRBB sensitivity (no Moody's field)",{"tone":"watch","v":""}],["Circular 2019/2 interest rate risks (FINMA, 4 Nov, consultation)","UBS Group AG","IRRBB sensitivity (no Moody's field)",{"tone":"watch","v":""}],["Consolidated guidelines, consequential amendments (BCBS, 5 Nov, consultation)","All 15 names, once their home authority applies the standard","none: cross-references (no channel-map row)",{"tone":"watch","v":""}],["2027 EU-wide stress test methodology (EBA, 9 Nov, final)","Scope not known: EU names in the EBA sample, which the page does not list (BNP Paribas, Credit Agricole, Societe Generale, Deutsche Bank, ING, UniCredit, Intesa Sanpaolo, BBVA, CaixaBank, Commerzbank, Nordea)","stress test results (no Moody's field)",{"tone":"watch","v":""}],["Supervisory reporting simplification, timelines extended (EBA, 6 Nov)","BNP Paribas, Credit Agricole, Societe Generale, Deutsche Bank, ING, UniCredit, Intesa Sanpaolo, BBVA, CaixaBank, Commerzbank, Nordea","reporting (no Moody's field)",{"tone":"watch","v":""}],["Revised Guidelines on internal governance (EBA, 5 Nov, final)","BNP Paribas, Credit Agricole, Societe Generale, Deutsche Bank, ING, UniCredit, Intesa Sanpaolo, BBVA, CaixaBank, Commerzbank, Nordea","governance (no Moody's field)",{"tone":"watch","v":""}],["Securitisation Framework review, political agreement (European Commission, 22 Oct)","BNP Paribas, Credit Agricole, Societe Generale, Deutsche Bank, ING, UniCredit, Intesa Sanpaolo, BBVA, CaixaBank, Commerzbank, Nordea","securitisation (no Moody's field)",{"tone":"watch","v":""}],["PS20/26 Large exposures Part 2 (PRA, 10 Nov, final)","HSBC, Barclays, Lloyds","large exposures (no Moody's field)",{"tone":"watch","v":""}],["CP14/26 SM&CR Phase 2 (PRA, 22 Oct, consultation)","HSBC, Barclays, Lloyds","governance, conduct (no Moody's field)",{"tone":"watch","v":""}],["FINMA Anti-Money Laundering Ordinance, partial revision (FINMA, 10 Nov, final)","UBS Group AG","AML (no Moody's field)",{"tone":"watch","v":""}]],"note":"Moody's financial data carries no metric for these channels, so no name is given a position. Coverage by issuer: Basel Committee - every bank once applied at home; EBA and EU legislation - EU/EEA groups; PRA - UK groups; FINMA - Swiss groups."},{"title":"Left out","type":"text","text":"Seen in the window and left out, by reason. Speeches, interviews, news and blogs: ECB Banking Supervision (8), SRB (4), FINMA (1). Newsletters: BCBS AML/CFT newsletter No 37, PRA Regulatory Digest October 2026, ECB Supervision Newsletter of 11 Nov (seen in search only). Sanctions notices: FINMA (8), European Commission (3). Periodic lists and reports: ECB list of supervised entities, ECB written overview for the Eurogroup. Statistics: Commission sustainable investment data. Advice from one authority to another: EBA advice on Taxonomy disclosures. Appointments: EBA Vice-Chair. Consumer material: EBA white-label factsheet. Statements and dialogues: EBA support for the NGFS declaration, Commission summary of the banking competitiveness dialogue, tokenisation stakeholder nominations. Addressed to other kinds of firm: PRA CP15/26 and DP2/26 (credit unions), FINMA Bitcoin ETF approval, Commission assurance standards for sustainability reporting.","src":[]}],"sources":[{"id":"w_basel","kind":"web","title":"Basel Framework (LEV, LCR, NSF standards)","date":"2026-11-15","url":"https://www.bis.org/basel_framework/"},{"id":"w_fsb","kind":"web","title":"FSB, 2025 List of Global Systemically Important Banks (G-SIBs)","date":"2025-11-27","url":"https://www.fsb.org/2025/11/2025-list-of-global-systemically-important-banks-g-sibs/"},{"id":"w_wd","kind":"web","title":"BCBS, Amendments to G-SIB framework to address window dressing","date":"2026-10-16","url":"https://www.bis.org/publications/202610-standards-amendments-g-sib-framework-address-window-dressing"},{"id":"w_meth","kind":"web","title":"BCBS, Global systemically important banks - methodology review (consultative)","date":"2026-10-16","url":"https://www.bis.org/publications/202610-consultation-global-systemically-important-banks-methodology-review"},{"id":"w_cons","kind":"web","title":"BCBS, Consolidated guidelines - consequential amendments (consultative)","date":"2026-11-05","url":"https://www.bis.org/publications/consolidated-guidelines-consequential-amendments"},{"id":"w_irrbb","kind":"web","title":"BCBS, Interest rate risk in the banking book - additional Pillar 2 guidance (consultative)","date":"2026-11-09","url":"https://www.bis.org/publications/interest-rate-risk-banking-book---additional-pillar-2-guidance"},{"id":"w_st","kind":"web","title":"EBA, The EBA streamlines the 2027 EU-wide stress test","date":"2026-11-09","url":"https://www.eba.europa.eu/publications-and-media/press-releases/eba-streamlines-2027-eu-wide-stress-test-more-55-reduction-requested-data"},{"id":"w_rep","kind":"web","title":"EBA, Next steps on supervisory reporting simplification and extended implementation timelines","date":"2026-11-06","url":"https://www.eba.europa.eu/publications-and-media/press-releases/eba-outlines-next-steps-supervisory-reporting-simplification-an  sector file, pulled 15 Nov 2026: Annual report on Form 20-F for 2025, as of 31 Dec 2025","title":"Barclays PLC stated CET1 requirement","date":"2026-11-15"},{"id":"r_ing","kind":"moodys","tool":"searchCompanyFilings","ref":"bank sector file, pulled 15 Nov 2026: Annual report on Form 20-F for 2025, as of 31 Dec 2025","title":"ING Groep N.V. stated CET1 requirement","date":"2026-11-15"},{"id":"r_gca","kind":"moodys","tool":"searchCompanyFilings","ref":"bank sector file, pulled 15 Nov 2026: First quarter 2026 results slides (filed under Credit Agricole S.A.), as of 31 Mar 2026","title":"Groupe Credit Agricole stated distance to SREP CET1 requirement","date":"2026-03-31"}],"unresolved":[],"notes":["Positions show relative position among the names each rule covers, on the stated metric. They are not an estimate of impact.","The 100% LCR minimum is the Basel III standard; local rules can be higher.","Window 16 Oct to 15 Nov 2026, both days included. Every item in it is new to the running list, which was empty before this run.","Moody's research checked for the G-SIB window-dressing standard, the securitisation agreement, the EBA stress test and IRRBB guidance; Moody's had commented only on the EBA governance guidelines (11 Nov 2026).","Bank figures are as reported (Moody's Bank Focus data), Q2 2026, not Moody's-adjusted."],"meta":{"calls":{"moodys":6,"web":25}}},{"schema":"fi-dashboard/1","agent":"reg-watch","title":"Regulatory watch","updated_at":"2026-11-15T20:13:42Z","scope":{"sector":"Banks","region":"Europe","window":"7 days, 9 to 15 Nov 2026","names":15},"status":"ok","headline":"Four new regulatory items this week, none on a channel Moody's data measures: a Basel consultation on IRRBB Pillar 2 guidance (all 15 names), the EBA's final 2027 stress test methodology (EU names), the PRA's final large exposures rules (HSBC, Barclays, Lloyds) and FINMA's revised AML ordinance (UBS).","headline_src":["w1","w2","w3","w4"],"sections":[{"title":"What changed","type":"items","items":[{"flag":"NEW","tag":"Final","name":"PRA","text":"PS20/26, the second part of the response to CP14/24 on large exposures: substitution becomes mandatory for credit risk mitigation, the internal-model option for securities financing transactions is removed, a reduced time-limited trading book excess allowance is kept, and a single higher NCLEG limit is set for trading book intragroup exposures, with new exemptions for funded sovereign collateral and tri-party repo. Applies from 1 January 2028; NCLEG permission applications from 1 July 2027.","why":"Channel: large exposures (no Moody's metric; watch). Concentration limits for UK-headquartered groups: HSBC, Barclays, Lloyds. Moody's has published no comment on it in the window.","src":["w3","m1"]},{"flag":"NEW","tag":"Final","name":"FINMA","text":"FINMA published the final partially revised Anti-Money Laundering Ordinance (AMLO-FINMA), aligned with recent Anti-Money Laundering Act changes; after consultation it narrowed the correspondent banking provision to clients with direct access to the correspondent bank's accounts. In force 1 January 2027, with a four-month transition for self-regulation.","why":"Channel: AML (no Moody's metric; watch). Covers UBS (home supervisor FINMA). Moody's has published no comment on it in the window.","src":["w4","m1"]},{"flag":"NEW","tag":"Consultation","name":"Basel Committee","text":"Consultation on additional Pillar 2 guidance for interest rate risk in the banking book, covering model risk, stress testing, controls, embedded gains and losses and earnings indicators, plus proposed collection of supervisory information from banks. Comments by 9 February 2027. A consultation, not a final standard.","why":"Channel: interest rate risk in the banking book (no Moody's metric; watch). Covers every name on the list once home jurisdictions apply it. Moody's has published no comment on it in the window.","src":["w1","m1"]},{"flag":"NEW","tag":"Final","name":"EBA","text":"The EBA published the final methodology for the 2027 EU-wide stress test, with draft templates, cutting requested data points by 55% and adding a separate climate risk module that does not affect core results. Launch end-January 2027; results published end-July 2027.","why":"Channel: stress testing, which has no row in the channel map; treated as watch by judgment. EU names only; which of them take part depends on the EBA sample, which the page does not name. Moody's has published no comment on it in the window.","src":["w2","m1"]}]},{"title":"Who it hits: no Moody's metric","type":"table","columns":["Item","Covers on this list","Metric needed","Call"],"rows":[[{"v":"PRA PS20/26 large exposures (final, 10 Nov 2026)","src":["w3"]},"HSBC Holdings plc, Barclays PLC, Lloyds Banking Group plc","Large exposures: not in Moody's data",{"tone":"watch","v":"watch"}],[{"v":"FINMA AMLO-FINMA revision (final, 10 Nov 2026)","src":["w4"]},"UBS Group AG","AML: not in Moody's data",{"tone":"watch","v":"watch"}],[{"v":"Basel IRRBB Pillar 2 guidance (consultation, 9 Nov 2026)","src":["w1"]},"All 15 names, once their home jurisdiction applies it","IRRBB sensitivity: not in Moody's data",{"tone":"watch","v":"watch"}],[{"v":"EBA 2027 EU-wide stress test methodology (final, 9 Nov 2026)","src":["w2"]},"EU names: BNP Paribas, Credit Agricole S.A., Societe Generale, Deutsche Bank, Commerzbank, ING, UniCredit, Intesa Sanpaolo, BBVA, CaixaBank, Nordea. Scope not known: participation depends on the EBA sample, not named on the page","Stress-test capital depletion: not in Moody's data",{"tone":"watch","v":"watch"}]],"note":"Out of scope for the PRA item: all non-UK groups (home supervisor not PRA); UK subsidiaries of non-UK groups are not counted. Out of scope for the FINMA item: all non-Swiss groups. Out of scope for the EBA item: HSBC, Barclays, Lloyds (GB) and UBS (CH).","note_src":[]}],"sources":[{"id":"w1","kind":"web","title":"Basel Committee: Interest rate risk in the banking book - additional Pillar 2 guidance (consultative document)","date":"2026-11-09","url":"https://www.bis.org/publications/interest-rate-risk-banking-book---additional-pillar-2-guidance"},{"id":"w2","kind":"web","title":"EBA: The EBA streamlines the 2027 EU-wide stress test with more than 55% reduction in requested data","date":"2026-11-09","url":"https://www.eba.europa.eu/publications-and-media/press-releases/eba-streamlines-2027-eu-wide-stress-test-more-55-reduction-requested-data"},{"id":"w3","kind":"web","title":"PRA: PS20/26 - Amendments to the Large Exposures Framework - Part 2","date":"2026-11-10","url":"https://www.bankofengland.co.uk/prudential-regulation/publication/2026/november/amendments-to-the-large-exposures-framework-part-2-policy-statement"},{"id":"w4","kind":"web","title":"FINMA publishes partially revised FINMA Anti-Money Laundering Ordinance","date":"2026-11-10","url":"https://www.finma.ch/en/news/2026/11/20261110-mm-gwv-finma/"},{"id":"m1","kind":"moodys","tool":"searchAllDocuments","ref":"Banking, Europe/United Kingdom, published 9-15 Nov 2026; keywords on IRRBB, EBA 2027 stress test and PRA large exposures: no Moody's document on these items","title":"Moody's research search for comment on this week's items","date":"2026-11-15"}],"unresolved":[],"notes":["No financials call was made: none of this week's items maps to a metric Moody's data carries, so no name is given a position.","Left out (not a rule, guideline, consultation, supervisory decision or legislative step addressed to banks): European Commission consultation on limited assurance standards for sustainability reporting, 12 Nov (addressed to assurance providers, auditors and all CSRD reporters, not banks as such); EBA statement supporting the NGFS declaration, 13 Nov (statement of support); EBA consumer factsheet on white-labelled products, 9 Nov (consumer material); ECB Supervisory Board Chair written overview for the Eurogroup, 9 Nov (report to another authority); SRB news on the EU banking competitiveness dialogue, 13 Nov (meeting news); SRB Chair speeches, 10 and 11 Nov (speeches); Commission summary of the first EU banking competitiveness dialogue, 11 Nov (meeting summary); Commission call for nominations to a tokenisation standards stakeholder group, 9 Nov (appointments).","Moody's research published 9-15 Nov 2026 carries no comment on any of the four items (searchAllDocuments, three searches).","Every regulator listing in the sector file was opened; Basel Committee news, ECB press feed, SRB, PRA and FINMA listings showed nothing else in scope inside the window."],"meta":{"calls":{"moodys":3,"web":20}}}]},{"agent":"earnings-credit","title":"Earnings","order":null,"runs":[{"schema":"fi-dashboard/1","agent":"earnings-credit","title":"Earnings","updated_at":"2026-11-15T20:07:56Z","scope":{"label":"Vodafone, recap","sector":"Telecoms","region":"Europe","window":"Half-year FY27 results (six months to 30 Sep 2026), call of 10 Nov 2026","names":1},"status":"ok","headline":"Vodafone raised its FY27 guidance at its half-year results on 10 Nov 2026; company-reported net debt rose by €8.1bn to €33.5bn, mainly on the VodafoneThree buyout and the Safaricom stake, while Moody's-adjusted debt/EBITDA of 3.25x (FY to Mar 2026) sits 0.05x inside the 3.3x downgrade trigger in a credit opinion that predates these results.","headline_src":["s4","s5","s3","s1"],"sections":[{"title":"Results against the credit view","type":"items","items":[{"tag":"Guidance","name":"Upgraded","text":"Management upgraded FY27 group guidance. On the call they said the old guidance was tracking to the upper end of the former ranges, and that upper end is now the midpoint of the new ranges. At the midpoint, the new guidance means organic growth of 7% in adjusted EBITDA and 21% in adjusted free cash flow. The Europe outlook was kept, despite a €100m EBITDA hit from the European Court of Justice ruling in Germany. Neither the call excerpts nor the filing give the old and new ranges in euros. Company-reported.","why":"Higher guided EBITDA and free cash flow bear on the debt/EBITDA and RCF/net debt triggers. Moody's forecasts are annual (FY27F debt/EBITDA 3.1x) and cannot be checked against half-year figures. No beat or miss against Moody's forecast can be stated yet.","src":["s4","s1"]},{"tag":"Operations","name":"H1 FY27","text":"Management said adjusted EBITDA grew 6.4% in H1 and Q2 group service revenue grew 6.4%. Germany H1 EBITDA fell 3.2%, of which 2 points came from the ECJ provision. The half-year report shows a loss attributable to owners of €(4,789)m (H1 FY26: profit of €829m). This includes a non-cash impairment of Vodafone Germany, which management put mainly down to a higher discount rate (8% against 7.5%). Company-reported.","why":"Germany is the worded trigger in both directions. The opinion makes a downgrade conditional on 'a failure to turn around its German operations'.","src":["s4","s5","s1"]},{"tag":"Net debt","name":"Company measure","text":"Net debt rose by €8,062m to €33,473m at 30 Sep 2026, from €25,411m at 31 Mar 2026. The report names these drivers: a free cash outflow of €845m; acquisitions and disposals of €6,957m (the VodafoneThree 49% buyout €5,019m, the extra 15% of Safaricom €1,379m, and net debt acquired with Safaricom €537m); equity dividends €544m and share buybacks €92m; offset by other movements of €474m. Gross debt was €42,697m (31 Mar 2026: €38,604m), after new bond issues and €1,195m more bank loans. This is the company's own measure, not Moody's-adjusted debt.","why":"This is new debt taken on since the period behind Moody's-adjusted figures (FY to 31 Mar 2026), so the trigger ratios below do not yet include it.","src":["s5"]},{"tag":"Liquidity","name":"Cash and facilities","text":"Cash, cash equivalents and short-term investments were €8.4bn (31 Mar 2026: €12.4bn). Undrawn revolving credit facilities were €7.6bn: €4.1bn maturing in 2031 and US$4.0bn (€3.5bn) maturing in 2028. Company-reported. Moody's describes liquidity as excellent, and its rating action says the facilities are free of financial covenants and material adverse change clauses.","why":"Liquidity headroom after the cash-funded deals. The outlook assumes the company will 'maintain excellent liquidity'.","src":["s5","s7"]},{"tag":"Maturities","name":"Refinancing","text":"The half-year report found does not give a maturity table. The annual report (31 Mar 2026) shows €3,003m of contractual bond cash flows, including interest, due within one year. It says non-current borrowings mature between 1 and 60 years, with a cap on maturities in any one calendar year. The bonds issued in H1 are not itemised in the excerpts. Company-reported.","why":"Near-term refinancing need against the €7.6bn of undrawn facilities.","src":["s6","s5"]},{"tag":"Capex","name":"H1 FY27","text":"Capital additions were €3,320m in H1 FY27 (H1 FY26: €2,800m). Adjusted free cash flow was an outflow of €440m, an improvement of €143m on the prior year. Management said they would not guide to any material reduction in capital intensity in Germany. On the call, an analyst said Vodafone may have to fund equity injections of up to €1.2bn into the OXG fibre JV (the analyst's figure). Management said any equity would be phased over the build. Company-reported.","why":"Capex bears on (EBITDA - CAPEX) / interest expense, 2.39x in FY to Mar 2026.","src":["s5","s4","s3"]},{"tag":"Shareholder returns","name":"Dividends and buybacks","text":"Interim dividend of 2.306 eurocents per share, up 2.5% (H1 FY26: 2.25 eurocents), set at 50% of the prior full-year dividend. Cash paid in H1: equity dividends €544m and buybacks €92m. Company-reported.","why":"Cash leaving the group while net debt rises.","src":["s5"]},{"tag":"Other","name":"Safaricom","text":"On the call, an analyst said Kenya's High Court declared the 15% Safaricom stake sale void in September (the analyst's statement). Management referred to local legal challenges. The excerpts do not show the outcome.","why":"This bears on the consolidation of Safaricom and on the €537m of net debt acquired with it.","src":["s4","s5"]}]},{"title":"Against Moody's triggers","type":"table","columns":["Metric","Latest Moody's-adjusted (FY to 31 Mar 2026)","Upgrade trigger","Downgrade trigger","Room to upgrade","Room to downgrade"],"rows":[["Debt / EBITDA",{"v":"3.25x","src":["s3"]},{"v":"below 2.5x","src":["s1"]},{"v":"fails to remain below 3.3x on a sustained basis","src":["s1"]},{"v":"0.75x above it","src":["s3","s1"]},{"v":"0.05x","src":["s3","s1"]}],["RCF / Net Debt",{"v":"33.08%","src":["s3"]},{"v":"higher than 25% on a sustained basis","src":["s1"]},{"v":"declines towards 18% on a sustained basis","src":["s1"]},{"v":"already met, by 8.1pp","src":["s3","s1"]},{"v":"15.1pp","src":["s3","s1"]}]],"note":"Worded triggers: upgrade if 'underlying revenue and operating performance improve sustainably, particularly in Germany'; downgrade if 'operating performance deteriorates, including a failure to turn around its German operations'. Moody's forecasts: debt/EBITDA 3.1x, RCF/net debt 29.4% for FY2027F.","note_src":["s1"]},{"title":"What it means for the rating and outlook","type":"items","items":[{"tag":"Rating","name":"Baa2 stable","text":"Baa2 Senior Unsecured (foreign currency), outlook stable, affirmed on 13 Oct 2026. The credit opinion of 21 Oct 2026 predates these results. Moody's-adjusted debt/EBITDA is 3.25x against a 3.3x downgrade trigger (0.05x of room). RCF/net debt is 33.08%, above the 25% upgrade level and 15.1pp above the 18% downgrade level. Both are for the year to 31 Mar 2026. The outlook expects 'Moody's-adjusted debt/EBITDA below 3.3x and RCF/net debt of around 30%', and assumes the company stays 'within the lower half of its net leverage target range' (2.25x-2.75x).","why":"The position against the triggers is shown here. Any conclusion is Moody's to draw.","src":["s2","s1","s3"]},{"tag":"Net debt change","name":"Since the Moody's period","text":"Company-reported net debt is €8.1bn higher than at 31 Mar 2026, the period end of the Moody's-adjusted figures. The filing attributes most of the increase to acquisitions (€6,957m, including the VodafoneThree buyout and Safaricom). The opinion addresses the UK buyout: the rating is constrained by 'reduced financial flexibility following the buyout of VodafoneThree', and Moody's quotes cash 'pro forma for the UK buyout'. The opinion text returned does not mention the Safaricom stake purchase. Its FY2027F forecasts (debt/EBITDA 3.1x, net debt/EBITDA 2.6x) are Moody's own, not recalculated here.","why":"Moody's FY27 figures will include the higher debt. The 0.05x of room was measured before that debt was added.","src":["s5","s1","s7"]},{"tag":"Moody's comment","name":"On these results","text":"Moody's has published no issuer comment or rating action on the 10 Nov results in the last 45 days. The latest documents are the rating action of 13 Oct 2026 and the credit opinion of 21 Oct 2026, both earlier than the results.","why":"Moody's has not yet given a view on the half-year figures.","src":["s7","s1"]}]}],"sources":[{"id":"s1","kind":"moodys","tool":"getCreditOpinion","ref":"PBC_1496608, Vodafone Group Plc: Update following ratings affirmation (Summary, Outlook, Upgrade/Downgrade factors, Key indicators)","title":"Vodafone Group Plc credit opinion","date":"2026-10-21","url":"https://www.moodys.com/research/doc--PBC_1496608"},{"id":"s2","kind":"moodys","tool":"getEntityRatings","ref":"RTNG_600018164, Senior Unsecured - Fgn Curr, affirmation 2026-10-13","title":"Vodafone Group Plc rating history","date":"2026-10-13","url":"https://www.moodys.com/credit-ratings/Vodafone-Group-Plc-credit-rating-600018164/summary"},{"id":"s3","kind":"moodys","tool":"getEntityFinancials_v2","ref":"Key indicators (Moody's-adjusted): Debt / EBITDA, RCF / Net Debt, (EBITDA - CAPEX) / Interest Expense, FY ending 31 Mar 2026","title":"Vodafone Group Plc financials (adjusted)","date":"2026-03-31","url":"https://www.moodys.com/entity/600018164/financials"},{"id":"s4","kind":"moodys","tool":"searchCompanyFilings","ref":"Earnings call transcript: Half Year 2027 Vodafone Group Public Ltd Co Earnings Call, event date 10 Nov 2026","title":"Vodafone H1 FY27 earnings call","date":"2026-11-10"},{"id":"s5","kind":"moodys","tool":"searchCompanyFilings","ref":"Interim report titled 'Vodafone Group Plc Interim Report 2026 - Q4' (half-year results, six months to 30 Sep 2026), submitted 10 Nov 2026, pp. 4, 11, 21, 29-30","title":"Vodafone half-year FY27 results report","date":"2026-11-10"},{"id":"s6","kind":"moodys","tool":"searchCompanyFilings","ref":"Annual Report on Form 20-F 2026 (year to 31 Mar 2026), submitted 22 May 2026, p. 193","title":"Vodafone Annual Report 2026","date":"2026-03-31"},{"id":"s7","kind":"moodys","tool":"searchAllDocuments","ref":"PR_528027, Moody's Ratings affirms Vodafone's ratings; stable outlook (no Issuer Comment on the 10 Nov results found, 1 Oct-15 Nov 2026)","title":"Vodafone rating action","date":"2026-10-13","url":"https://www.moodys.com/research/doc--PR_528027"}],"unresolved":[],"notes":["Mode: recap, as asked. Issuer taken from the checked telecoms-europe coverage list (Vodafone Group Plc, GB).","Company-reported net debt and Moody's-adjusted debt are different measures. They are shown side by side, each with its period, and no adjusted ratio was recalculated from company figures.","The half-year report is titled 'Interim Report 2026 - Q4' in Moody's data. Its period (to 30 Sep 2026) and submission date (10 Nov 2026) identify it as the half-year FY27 report.","No comparison with consensus: Moody's data holds none."],"meta":{"calls":{"moodys":7,"web":0}}},{"schema":"fi-dashboard/1","agent":"earnings-credit","title":"Earnings","updated_at":"2026-11-15T20:19:10Z","scope":{"label":"BNP Paribas, preview","sector":"Banks","region":"Europe","window":"latest data held by Moody's at 15 Nov 2026","names":1},"status":"ok","headline":"BNP Paribas is A1 (LT Issuer Rating), stable outlook, affirmed 31 Aug 2026. Its one numeric trigger is a return on assets of 0.6% or more for an upgrade, against 0.4% in the credit opinion's key indicators at Jun 2026. Its downgrade triggers are all worded. Moody's holds no call transcript, and the latest results filing it holds (Q3 2025) is older than the latest results in Moody's data (Q2 2026).","headline_src":["s1","s2","s3","s4","s5"],"sections":[{"title":"Rating and outlook","type":"items","items":[{"name":"BNP Paribas","tag":"Rating","text":"A1 LT Issuer Rating, outlook stable, last action an affirmation on 31 Aug 2026 (also affirmed 21 Apr 2026 and 18 Nov 2025; downgraded to A1 on 17 Dec 2024). Credit opinion dated 2 Sep 2026: \"Update following ratings affirmation\".","why":"Moody's says the stable outlook reflects \"very stable and highly predictable profitability and sound risk profile\", plus its expectation that the bank adapts its liability structure to EU general depositor preference with no material deterioration in loss severity for senior unsecured debt.","src":["s2","s1"]}]},{"title":"What to watch against Moody's triggers","type":"table","columns":["Metric","Latest value and period","Upgrade trigger","Downgrade trigger","Room to upgrade trigger"],"rows":[["Return on assets (credit opinion row: Net Income / Tangible Assets)",{"v":"0.4%, Jun 2026 (Moody's key indicators)","src":["s1"]},{"v":"0.6% and above (\"return on assets to levels of 0.6% and above\")","src":["s1"]},"None stated as a number",{"v":"0.2 pp below","src":["s1"]}]],"note":"Worded triggers, quoted from the credit opinion of 2 Sep 2026. Upgrade: \"if the group manages towards lower financial leverage and demonstrates strong and sustained stewardship through disciplined risk management\", \"limiting any sudden and significant increase in problem loans and risk provisioning\"; or \"An upgrade of the Government of France's rating\". Downgrade: \"if the bank maintained lower regulatory capital buffers or sustained higher regulatory leverage, together with a sustained deterioration in asset quality or profitability metrics\"; \"a marked increase in risk appetite, loss incidents or a material risk management failure\"; \"a material deterioration in operating conditions in the bank's main markets ... accompanied by a significant weakening of its funding and liquidity profile\"; for senior unsecured debt, if the increase in senior unsecured and lower-ranking debt relative to tangible banking assets \"falls short of our current expectations\" and cannot be offset by a one-notch government support uplift.","note_src":["s1"]},{"title":"Sector metrics to watch","type":"table","columns":["Metric","Latest value and period","Basis","Trigger it bears on"],"rows":[["Net interest margin",{"v":"0.9%, Jun 2026","src":["s1"]},"Moody's key indicators (credit opinion)",{"v":"Profitability (downgrade, worded); return on assets (upgrade, 0.6%)","src":["s1"]}],["Net interest income",{"v":"not in Moody's data from this run","tone":"nodata"},"","Profitability"],["Cost of risk",{"v":"not in Moody's data","tone":"nodata"},"","Risk provisioning (upgrade, worded)"],["CET1 ratio",{"v":"12.97%, Q2 2026","src":["s3"]},"As reported","Regulatory capital buffers (downgrade, worded)"],["CET1 requirement (bank-stated)",{"v":"10.51% at 30 Sep 2025 (older than the CET1 figure above)","src":["s5"]},"Company-reported","Regulatory capital buffers (downgrade, worded)"],["Tangible common equity / RWA",{"v":"13.7%, Jun 2026","src":["s1"]},"Moody's key indicators (credit opinion)","Regulatory capital buffers (downgrade, worded)"],["Leverage ratio (fully loaded)",{"v":"not in Moody's data","tone":"nodata"},"","Regulatory leverage (downgrade, worded)"],["Planned distributions",{"v":"not in Moody's data","tone":"nodata"},"","Regulatory capital buffers"],["Problem loans / gross loans",{"v":"2.9%, Jun 2026","src":["s1"]},"Moody's key indicators (credit opinion)","Problem loans (upgrade and downgrade, worded)"],["Impaired loans / gross customer loans",{"v":"2.93%, Q2 2026","src":["s3"]},"As reported","Asset quality (downgrade, worded)"],["Loan loss reserves / impaired loans",{"v":"57.7%, Q2 2026","src":["s3"]},"As reported","Asset quality"],["Cost / income ratio",{"v":"60.6%, Jun 2026","src":["s1"]},"Moody's key indicators (credit opinion)","Profitability (downgrade, worded)"],["LCR",{"v":"134.8%, Q2 2026","src":["s3"]},"As reported","Funding and liquidity (downgrade, worded)"],["NSFR",{"v":"108.6%, Q2 2026","src":["s3"]},"As reported","Funding and liquidity (downgrade, worded)"],["Core banking liquidity (HQLA) / tangible banking assets",{"v":"15.9%, Jun 2026","src":["s1"]},"Moody's key indicators (credit opinion)","Funding and liquidity (downgrade, worded)"],["Gross loans / customer deposits",{"v":"82.3%, Q2 2026","src":["s3"]},"As reported","Funding and liquidity"],["Gross loans / due to customers",{"v":"85.8%, Jun 2026","src":["s1"]},"Moody's key indicators (credit opinion)","Funding and liquidity"]],"note":"The two capital figures are a year apart: CET1 is Q2 2026 and the bank's stated requirement is 30 Sep 2025, so no distance is shown.","note_src":["s3","s5"]},{"title":"What the latest filing says","type":"items","items":[{"tag":"Trajectory","name":"Q3 2025 report","text":"The bank confirmed its 2026 trajectory: revenue CAGR above 5% for 2024-2026, jaws of about +1.5 points a year on average, net income CAGR above 7% and EPS CAGR above 8% for 2024-2026 (company-reported, period to 30 Sep 2025).","why":"The 2026 full-year results will be read against these. Profitability is part of the downgrade wording, and return on assets is the upgrade test.","src":["s5"]},{"tag":"Cost of risk","name":"Q3 2025 report","text":"Cost of risk target: \"below 40 bps in 2025 and 2026\". 3Q25 cost of risk was 39bps (company-reported).","why":"Moody's upgrade wording asks for \"limiting any sudden and significant increase in problem loans and risk provisioning\".","src":["s5"]},{"tag":"Returns","name":"Q3 2025 report","text":"RoTE targets of 11.5% for 2025, 12% for 2026 and 13% for 2028. The 2025 net income target was more than EUR 12.2bn (company-reported).","why":"RoTE is the company's measure, not the same as Moody's return on assets (0.4% at Jun 2026, trigger 0.6%).","src":["s5","s1"]},{"tag":"Capital","name":"Q3 2025 report","text":"CET1 12.5% phased-in at 30 Sep 2025, against a stated CET1 requirement of 10.51%. LCR 138%, leverage ratio 4.3% (company-reported). The bank says the Basel finalisation and model update cycle is ending, so RWA will move mainly with organic growth from here.","why":"These figures bear on the worded capital buffer and regulatory leverage trigger.","src":["s5"]}]},{"title":"Moody's expectations","type":"text","text":"The key indicators table in the credit opinion of 2 Sep 2026 has no forecast columns. It shows history from Dec 2022 to Jun 2026 only.","src":["s1"]}],"sources":[{"id":"s1","kind":"moodys","tool":"getCreditOpinion","ref":"PBC_1491623, sections FactorsLeadingToUpgrade, FactorsLeadingToDowngrade, RatingOutlook, KeyIndicatorsTable","title":"BNP Paribas: Update following ratings affirmation (Credit Opinion)","date":"2026-09-02","url":"https://www.moodys.com/research/doc--PBC_1491623"},{"id":"s2","kind":"moodys","tool":"getEntityRatings","ref":"RTNG_91000, LT Issuer Rating history, 2 years","title":"BNP Paribas (91000) - Rating History (LT Issuer Rating)","date":"2026-08-31","url":"https://www.moodys.com/credit-ratings/BNP-Paribas-credit-rating-91000/summary"},{"id":"s3","kind":"moodys","tool":"getEntityFinancials_v2","ref":"Bank Focus, consolidated, LQ = Q2 2026 (period end 30 Jun 2026): CET1 ratio (as reported), LCR (as reported), NSFR (as reported), impaired loans / gross customer loans, loan loss reserves / impaired loans, gross loans / customer deposits","title":"BNP Paribas - Financial Statements","date":"2026-06-30"},{"id":"s4","kind":"moodys","tool":"searchCompanyFilings","ref":"earnings_call_transcript, query on guidance and targets: not_found","title":"BNP Paribas - earnings call transcript filing (none held)","date":"2026-11-15"},{"id":"s5","kind":"moodys","tool":"searchCompanyFilings","ref":"BNP Paribas Interim Report 2025 - Q3 (third amendment to the 2024 Universal registration document; 30.09.2025 results), period end 30 Sep 2025, submission date 2025-09-30, pages 9, 33-34, 42","title":"BNP Paribas Interim Report 2025 - Q3","date":"2025-09-30"}],"unresolved":[],"notes":["Mode: preview. No mode was given and Moody's holds no call transcript for BNP Paribas, so preview was chosen.","No call transcript in Moody's data. The latest results filing held is the Q3 2025 report (period to 30 Sep 2025). The FY2025 annual report is also held but states no targets. Both are older than the Q2 2026 data in Moody's financials and credit opinion.","Return on assets is mapped to the credit opinion's 'Net Income / Tangible Assets' row. The opinion's trigger wording says 'return on assets' without naming the row.","The credit opinion of 2 Sep 2026 states the outlook for the long-term deposit, issuer and senior unsecured debt ratings.","Company-reported figures (RoTE, cost of risk, the bank's stated CET1 requirement) are not Moody's-adjusted measures."],"meta":{"calls":{"moodys":5,"web":0}}},{"schema":"fi-dashboard/1","agent":"earnings-credit","title":"Earnings","updated_at":"2026-11-15T20:19:08Z","scope":{"label":"BNP Paribas, recap","sector":"Banks","region":"Europe","window":"Q3 2026 results (reported 28 Oct 2026)","names":1},"status":"ok","headline":"BNP Paribas reported Q3 2026 net income of EUR 3.5bn on 28 Oct (Moody's Issuer Comment); Moody's holds no call transcript, and the latest results filing it holds is the Q3 2025 report, older than the latest results. A1 LT Issuer Rating, stable, affirmed 31 Aug 2026.","headline_src":["s5","s4","s2"],"sections":[{"title":"Results against the credit view","type":"items","items":[{"tag":"Results","name":"Q3 2026","text":"Moody's: net income EUR 3.5bn for Q3 2026, up 13.5% year on year; on Moody's calculations excluding exceptional items, annualised return on RWA 169bp, return on assets 43bp and return on tangible equity 13.0%. Cost of risk moderate and on target, cost growth outpaced by revenue growth, sizable pre-funding for 2027.","why":"Profitability is the metric in the upgrade trigger (return on assets of 0.6% and above).","src":["s5"]},{"tag":"Guidance","text":"No transcript or Q3 2026 filing in Moody's data, so results cannot be set against current guidance. The latest targets Moody's holds (company-reported, press release of 16 Sep 2025 in the Q3 2025 report): RoTE of 12% in 2026, 13% in 2028, CET1 ratio expected at 12.5% by end-2027; a 2027-2030 plan to be announced in early 2027. Moody's 13.0% Q3 2026 RoTE is Moody's own calculation, not the company's measure, so it is not compared with the 12% target. The credit opinion's key indicators table has no Moody's forecast columns.","why":"Beat or miss against guidance and Moody's forecast cannot be established from Moody's data for this quarter.","src":["s4","s1"]},{"tag":"Capital","text":"Company-reported, 30 Sep 2025 (Q3 2025 report, older than the latest results): CET1 ratio 12.5% phased-in against a CET1 requirement of 10.51%; quarter drivers +30bp organic capital generation, -20bp distribution, -35bp AXA IM, +25bp other. Latest in Moody's financials: CET1 ratio 12.97% (as reported), Q2 2026.","why":"Capital buffers are named in the downgrade trigger; the requirement figure is the latest stated in a filing Moody's holds (Sep 2025).","src":["s4","s3"]},{"tag":"Liquidity and funding","text":"Company-reported, Q3 2025 report: LCR 138% at 30 Sep 2025, 12-month rolling average 133% (liquidity surplus EUR 99bn), average liquid assets EUR 398bn; leverage ratio 4.3%; 2025 regulatory issuance plan EUR 22.5bn, about 94% done by 17 Oct 2025. Latest in Moody's financials, Q2 2026 (as reported): LCR 134.8%, NSFR 108.6%. Moody's Q3 2026 comment notes sizable pre-funding for 2027.","why":"Funding and liquidity weakening is named in the downgrade trigger.","src":["s4","s3","s5"]},{"tag":"Distributions","text":"Company-reported, Q3 2025 report: 60% proposed distribution of 2025 result; interim dividend of EUR 2,891m paid by 30 Sep 2025. No 2026 distribution figures in the filings Moody's holds.","why":"Distributions bear on the regulatory capital buffers in the downgrade trigger.","src":["s4"]}]},{"title":"Against Moody's triggers","type":"table","columns":["Metric","Latest Moody's value and period","Upgrade trigger","Downgrade trigger","Room to upgrade trigger"],"rows":[["Net income / tangible assets",{"v":"0.4% (Jun 2026, Moody's key indicators)","src":["s1"]},{"v":"return on assets of 0.6% and above","src":["s1"]},"No number stated",{"v":"0.2 pp below","src":["s1"]}]],"note":"Worded triggers (credit opinion, 2 Sep 2026). Downgrade: 'lower regulatory capital buffers or sustained higher regulatory leverage, together with a sustained deterioration in asset quality or profitability'; 'a marked increase in risk appetite, loss incidents or a material risk management failure'; material deterioration in operating conditions with significant weakening of funding and liquidity. Upgrade: lower financial leverage with disciplined risk management; an upgrade of France's rating (Aa3 negative).","note_src":["s1"]},{"title":"Sector metrics, latest in Moody's data","type":"table","columns":["Metric","Value","Period","Basis"],"rows":[["CET1 ratio",{"v":"12.97%","src":["s3"]},"Q2 2026","as reported"],["LCR",{"v":"134.8%","src":["s3"]},"Q2 2026","as reported"],["NSFR",{"v":"108.6%","src":["s3"]},"Q2 2026","as reported"],["Leverage ratio (fully loaded)",{"v":"not in Moody's data","tone":"nodata"},"",""],["Impaired loans / gross loans",{"v":"2.93%","src":["s3"]},"Q2 2026","Moody's data"],["Reserves / impaired loans",{"v":"57.7%","src":["s3"]},"Q2 2026","Moody's data"],["Loans / deposits",{"v":"82.3%","src":["s3"]},"Q2 2026","Moody's data"],["RWA / total assets",{"v":"   }
  function withUnsourced(parent, text) {
    var parts = String(text == null ? '' : text).split('UNSOURCED');
    parts.forEach(function (p, i) { if (p) parent.appendChild(document.createTextNode(p)); if (i < parts.length - 1) parent.appendChild(el('span', 'chip uns', 'UNSOURCED')); });
  }
  function toneChip(tone) { var c = el('span', 'chip tone-' + tone); c.appendChild(el('span', 'dot')); c.appendChild(document.createTextNode(TONES[tone] || tone)); return c; }

  function renderSection(sec, run, agent) {
    var s = el('section', 'sec'); s.appendChild(el('h2', null, sec.title || ''));
    if (sec.type === 'items') {
      var ul = el('ul', 'items');
      (sec.items || []).forEach(function (it) {
        var li = el('li'), head = el('div', 'it-head');
        if (it.flag) head.appendChild(el('span', 'chip new', it.flag));
        if (it.name) head.appendChild(el('span', 'chip name', it.name));
        if (it.tag) head.appendChild(el('span', 'chip', it.tag));
        if (it.tone) head.appendChild(toneChip(it.tone));
        if (head.childNodes.length) li.appendChild(head);
        var t = el('div', 'it-text'); withUnsourced(t, it.text); t.appendChild(refs(it.src, run, agent)); li.appendChild(t);
        if (it.why) { var w = el('div', 'why'); w.appendChild(el('i', null, 'Why it matters: ')); withUnsourced(w, it.why); li.appendChild(w); }
        ul.appendChild(li);
      });
      s.appendChild(ul);
    } else if (sec.type === 'table') {
      var box = el('div', 'scroll'), tb = el('table'), th = el('thead'), tr = el('tr');
      (sec.columns || []).forEach(function (c) { tr.appendChild(el('th', null, c)); }); th.appendChild(tr); tb.appendChild(th);
      var body = el('tbody');
      (sec.rows || []).forEach(function (row) {
        var r = el('tr');
        row.forEach(function (cell) {
          var td = el('td'), c = (cell && typeof cell === 'object') ? cell : { v: cell };
          var same = c.tone && String(c.v || '').trim().toLowerCase() === String(TONES[c.tone] || c.tone).toLowerCase(); // the marker already says it
          if (c.tone) { td.appendChild(toneChip(c.tone)); if (c.v && !same) td.appendChild(document.createTextNode(' ')); }
          withUnsourced(td, same ? '' : c.v); td.appendChild(refs(c.src, run, agent)); r.appendChild(td);
        });
        body.appendChild(r);
      });
      tb.appendChild(body); box.appendChild(tb); s.appendChild(box);
      if (sec.note) { var tn = el('p', 'tnote'); withUnsourced(tn, sec.note); tn.appendChild(refs(sec.note_src, run, agent)); s.appendChild(tn); }
    } else {
      var p = el('p', 'text'); withUnsourced(p, sec.text); p.appendChild(refs(sec.src, run, agent)); s.appendChild(p);
    }
    return s;
  }

  function renderRun(tab) {
    var agent = tab.agent, runs = tab.runs || [], run = runs[picked[agent] || 0];
    panel.textContent = ''; panel.className = 'panel' + (run && run.status === 'quiet' ? ' quiet' : '');
    if (!run) { panel.appendChild(el('div', 'empty', 'No run saved for this agent yet.')); return; }
    run._num = {}; (run.sources || []).forEach(function (s, i) { run._num[s.id] = i + 1; });
    var strip = el('div', 'strip');
    strip.appendChild(el('span', null, scopeLine(run.scope)));
    strip.appendChild(el('span', 'grow'));
    strip.appendChild(el('span', null, 'Updated ' + fmt(run.updated_at)));
    if (runs.length > 1) {
      var sel = el('select'); sel.id = 'run-' + agent; sel.setAttribute('aria-label', 'Choose a saved run');
      runs.forEach(function (r, i) { var sc = r.scope || {}, name = sc.label || [sc.sector, sc.region, sc.window].filter(Boolean).join(', ') || r.title || agent; var o = el('option', null, fmt(r.updated_at) + ' · ' + name + (r.status === 'quiet' ? ' · quiet' : '')); o.value = i; sel.appendChild(o); });
      sel.value = String(picked[agent] || 0);
      sel.addEventListener('change', function () { picked[agent] = +sel.value; renderRun(tab); });
      strip.appendChild(sel);
    }
    panel.appendChild(strip);
    var h = el('p', 'headline'); withUnsourced(h, run.headline); panel.appendChild(h);
    (run.sections || []).forEach(function (sec) { panel.appendChild(renderSection(sec, run, agent)); });
    if (run.unresolved && run.unresolved.length) {
      var u = el('section', 'sec'); u.appendChild(el('h2', null, 'Unresolved names'));
      u.appendChild(el('div', 'box', run.unresolved.map(function (x) { return typeof x === 'string' ? x : (x.name + (x.reason ? ' (' + x.reason + ')' : '')); }).join('; ') + '. Not guessed, not included.'));
      panel.appendChild(u);
    }
    if (run.sources && run.sources.length) {
      var ss = el('section', 'sec'); ss.appendChild(el('h2', null, 'Sources')); var ol = el('ol', 'sources');
      run.sources.forEach(function (s, i) {
        var li = el('li'); li.id = 'src-' + agent + '-' + (i + 1);
        li.appendChild(el('span', 'kind', s.kind === 'web' ? 'Web' : "Moody's"));
        var label = [s.title, s.ref, s.date].filter(Boolean).join(' · ');
        if (s.url && /^https:\/\//.test(s.url) && s.url.length < 300) { var a = el('a', null, label || s.url); a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; li.appendChild(a); }
        else li.appendChild(document.createTextNode(label));
        if (s.tool) li.appendChild(el('span', 'kind', ' ' + s.tool));
        ol.appendChild(li);
      });
      ss.appendChild(ol); panel.appendChild(ss);
    }
    if (run.notes && run.notes.length) {
      var ns = el('section', 'sec'), nl = el('ul', 'notes'); run.notes.forEach(function (n) { nl.appendChild(el('li', null, n)); }); ns.appendChild(nl); panel.appendChild(ns);
    }
  }

  function select(agent, push) {
    var tab = tabs.filter(function (t) { return t.agent === agent; })[0] || tabs[0]; if (!tab) return;
    Array.prototype.forEach.call(tabsEl.children, function (b) { b.setAttribute('aria-selected', b.dataset.agent === tab.agent ? 'true' : 'false'); });
    renderRun(tab);
    if (push) { try { history.replaceState(null, '', '#' + tab.agent); } catch (e) { location.hash = tab.agent; } }
  }

  if (!tabs.length) {
    var e = el('div', 'empty');
    e.appendChild(el('p', null, 'No agent has saved a run yet.'));
    e.appendChild(el('p', null, 'Run sector-news-brief, reg-watch or earnings-credit. Each run saves one data file and this page is rebuilt with a tab for it.'));
    panel.appendChild(e);
  } else {
    tabs.forEach(function (t) {
      var latest = (t.runs || [])[0] || {}, b = el('button', 'tab'); b.type = 'button'; b.dataset.agent = t.agent; b.setAttribute('role', 'tab');
      b.appendChild(el('b', null, t.title || t.agent));
      b.appendChild(el('small', null, latest.updated_at ? 'Updated ' + fmt(latest.updated_at) + (ago(latest.updated_at) ? ' · ' + ago(latest.updated_at) : '') : 'No run yet'));
      b.addEventListener('click', function () { select(t.agent, true); });
      tabsEl.appendChild(b);
    });
    select((location.hash || '').replace('#', ''), false);
    window.addEventListener('hashchange', function () { select((location.hash || '').replace('#', ''), false); });
  }
  if (DATA.built_at) document.getElementById('built').textContent = 'Page rebuilt ' + fmt(DATA.built_at);
})();
</script>
